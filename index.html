<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit Word Game 🍓</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      color: #e53e3e;
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #718096;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-weight: 600;
      color: #2d3748;
    }

    .timer-low {
      color: #e53e3e;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .scrambled-box {
      border: 2px dashed #48bb78;
      border-radius: 12px;
      background: #f0fff4;
      padding: 18px 10px;
      margin-bottom: 20px;
    }

    .scrambled-word {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 6px;
      color: #276749;
      text-transform: uppercase;
      word-break: break-all;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #48bb78;
    }

    input[type="text"]:disabled {
      background-color: #edf2f7;
      cursor: not-allowed;
    }

    button {
      background: #48bb78;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: #38a169;
    }

    button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    .message-area {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      border-radius: 8px;
      padding: 8px 12px;
    }

    .msg-hint {
      color: #4a5568;
      background: #edf2f7;
    }

    .msg-success {
      color: #22543d;
      background: #c6f6d5;
    }

    .msg-error {
      color: #742a2a;
      background: #fed7d7;
    }

    .game-over-container {
      margin-top: 10px;
    }

    .game-over-title {
      font-size: 1.8rem;
      color: #e53e3e;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .game-over-score {
      font-size: 1.3rem;
      color: #2d3748;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🍓 Fruit Word Game 🍉</h1>
    <p class="subtitle">Unscramble the fruit names before time runs out!</p>

    <div class="stats-bar">
      <span>Score: <span id="score">0</span> / 10</span>
      <span>⏳ Time: <span id="timer">30</span>s</span>
    </div>

    <div id="game-body">
      <div class="scrambled-box">
        <div class="scrambled-word" id="scrambled-word">------</div>
      </div>

      <form id="guess-form" onsubmit="handleGuess(event)">
        <input 
          type="text" 
          id="guess-input" 
          placeholder="Type your guess..." 
          autocomplete="off"
          required
        />
        <button type="submit" id="submit-btn">Guess</button>
      </form>
    </div>

    <div class="message-area msg-hint" id="message-area">
      Loading game...
    </div>
  </div>

  <script>
    const fruitList = [
      { word: "APPLE", hint: "💡 Hint: Keeps the doctor away!" },
      { word: "BANANA", hint: "💡 Hint: Long, yellow, and loved by monkeys!" },
      { word: "ORANGE", hint: "💡 Hint: A citrus fruit named after its color!" },
      { word: "STRAWBERRY", hint: "💡 Hint: Red fruit with seeds on the outside!" },
      { word: "MANGO", hint: "💡 Hint: Known as the king of tropical fruits!" },
      { word: "PINEAPPLE", hint: "💡 Hint: Has a spiky crown and yellow inside!" },
      { word: "WATERMELON", hint: "💡 Hint: Green on the outside, red and juicy inside!" },
      { word: "GRAPE", hint: "💡 Hint: Small round fruit that grows in bunches!" },
      { word: "PEACH", hint: "💡 Hint: Fuzzy skin with a big hard pit inside!" },
      { word: "LEMON", hint: "💡 Hint: Very sour yellow citrus fruit!" }
    ];

    let currentRound = 0;
    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let isRoundActive = false;

    const scrambledWordEl = document.getElementById("scrambled-word");
    const guessInput = document.getElementById("guess-input");
    const submitBtn = document.getElementById("submit-btn");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const messageArea = document.getElementById("message-area");
    const gameBody = document.getElementById("game-body");

    function shuffleWord(word) {
      if (word.length <= 1) return word;
      let scrambled = word;
      let attempts = 0;

      while (scrambled === word && attempts < 20) {
        let arr = word.split("");
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        scrambled = arr.join("");
        attempts++;
      }
      return scrambled;
    }

    function setMessage(text, type) {
      messageArea.textContent = text;
      messageArea.className = "message-area " + type;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 30;
      timerEl.textContent = timeLeft;
      timerEl.classList.remove("timer-low");

      timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;

        if (timeLeft <= 5) {
          timerEl.classList.add("timer-low");
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function loadRound() {
      if (currentRound >= fruitList.length) {
        endGame();
        return;
      }

      isRoundActive = true;
      const currentFruit = fruitList[currentRound];
      const scrambled = shuffleWord(currentFruit.word);

      scrambledWordEl.textContent = scrambled;
      guessInput.value = "";
      guessInput.disabled = false;
      submitBtn.disabled = false;
      guessInput.focus();

      setMessage(currentFruit.hint, "msg-hint");
      startTimer();
    }

    function handleGuess(e) {
      e.preventDefault();
      if (!isRoundActive) return;

      const userGuess = guessInput.value.trim().toUpperCase();
      const currentFruit = fruitList[currentRound];

      if (!userGuess) return;

      if (userGuess === currentFruit.word) {
        isRoundActive = false;
        clearInterval(timerInterval);
        score++;
        scoreEl.textContent = score;

        guessInput.disabled = true;
        submitBtn.disabled = true;

        setMessage("🎉 Correct! Great job!", "msg-success");

        setTimeout(() => {
          currentRound++;
          loadRound();
        }, 1500);
      } else {
        setMessage("❌ Incorrect guess! Try again.", "msg-error");
        guessInput.value = "";
        guessInput.focus();
      }
    }

    function handleTimeout() {
      isRoundActive = false;
      const currentFruit = fruitList[currentRound];

      guessInput.disabled = true;
      submitBtn.disabled = true;

      setMessage(`⏰ Time's up! The answer was ${currentFruit.word}.`, "msg-error");

      setTimeout(() => {
        currentRound++;
        loadRound();
      }, 2500);
    }

    function endGame() {
      clearInterval(timerInterval);
      timerEl.textContent = "0";
      timerEl.classList.remove("timer-low");

      gameBody.innerHTML = `
        <div class="game-over-container">
          <div class="game-over-title">GAME OVER</div>
          <div class="game-over-score">Final Score: ${score} / ${fruitList.length} 🎉</div>
          <button onclick="resetGame()">Play Again 🔄</button>
        </div>
      `;

      setMessage("Thanks for playing!", "msg-hint");
    }

    function resetGame() {
      currentRound = 0;
      score = 0;
      scoreEl.textContent = score;

      gameBody.innerHTML = `
        <div class="scrambled-box">
          <div class="scrambled-word" id="scrambled-word">------</div>
        </div>

        <form id="guess-form" onsubmit="handleGuess(event)">
          <input 
            type="text" 
            id="guess-input" 
            placeholder="Type your guess..." 
            autocomplete="off"
            required
          />
          <button type="submit" id="submit-btn">Guess</button>
        </form>
      `;

      // Re-bind dynamically created elements
      window.scrambledWordEl = document.getElementById("scrambled-word");
      window.guessInput = document.getElementById("guess-input");
      window.submitBtn = document.getElementById("submit-btn");

      loadRound();
    }

    // Start game on page load
    window.onload = loadRound;
  </script>
</body>
</html>
